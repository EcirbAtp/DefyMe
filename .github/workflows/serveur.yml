# Vérifications du serveur de mise en relation et du réseau (D-T-04) :
# tests du serveur dans le moteur de Cloudflare (en local, sans compte),
# puis vraies connexions WebRTC entre 8 onglets d'un navigateur invisible.
name: Serveur et réseau

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serveur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: serveur/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
