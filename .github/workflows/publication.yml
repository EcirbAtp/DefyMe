# Mise en ligne automatique sur GitHub Pages à chaque fusion dans main
# (D-T-05, adresse https://ecirbatp.github.io/DefyMe/). La publication n'a lieu
# que si les types, les tests et la construction passent (D-T-04).
name: Publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Une seule publication à la fois, sans interrompre celle en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
